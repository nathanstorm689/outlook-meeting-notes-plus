name: Release Obsidian plugin

# Triggered by pushing a version tag (e.g. `git tag 0.3.3 && git push origin 0.3.3`).
# Builds the plugin from source, attaches a cryptographic build-provenance
# attestation to main.js and styles.css (proving they were built from this
# repository by this workflow, not hand-uploaded), and publishes the GitHub
# Release with all three required assets.

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Build plugin
        run: |
          npm ci
          npm run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          gh release create "$tag" \
            --title="$tag" \
            --generate-notes \
            main.js manifest.json styles.css
